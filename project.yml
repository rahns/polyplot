name: Polyplot

options:
  bundleIdPrefix: com.rahns
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    # Local builds only. CI overrides both with the workflow run number (see build.yml).
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Swift 5 language mode for now; move to Swift 6 once the app's concurrency is settled.
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  PolyplotCore:
    path: Packages/PolyplotCore

targets:
  Polyplot:
    type: application
    platform: iOS
    sources:
      - path: Polyplot
      - path: Shared
    dependencies:
      - package: PolyplotCore
      - target: PolyplotWidgets
        embed: true
    entitlements:
      path: Polyplot/Polyplot.entitlements
    info:
      path: Polyplot/Info.plist
      properties:
        CFBundleDisplayName: Polyplot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        # The backup file (Settings → Save backup): a .polyplot file, not plain JSON.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.rahns.polyplot.backup
            UTTypeDescription: Polyplot Backup
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [polyplot]
              public.mime-type: [application/x-polyplot-backup]
        # One-time import of backups from before the rename (docs/04-data-model.md §4.3). Remove with it.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.rahns.rumbo.backup
            UTTypeDescription: Backup from before the rename
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [rumbo]
        CFBundleURLTypes:
          - CFBundleURLName: com.rahns.polyplot
            CFBundleURLSchemes: [polyplot]
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes:
          - duolingo
          - youtube
          - dreamingspanish
          - dreaming
          - languagetransfer
          - tandem
          - spotify
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rahns.polyplot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: []

  PolyplotWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PolyplotWidgets
      - path: Shared
    dependencies:
      - package: PolyplotCore
    entitlements:
      path: PolyplotWidgets/PolyplotWidgets.entitlements
    info:
      path: PolyplotWidgets/Info.plist
      properties:
        CFBundleDisplayName: Polyplot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rahns.polyplot.widgets
