name: Build

# Builds run only when asked for (Actions tab → Build → Run workflow), or for release tags.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      # Every run gets a higher version so a new IPA installs over the previous one.
      BUILD_NUMBER: ${{ github.run_number }}
      APP_VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test PolyplotCore
        run: swift test --package-path Packages/PolyplotCore

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project Polyplot.xcodeproj \
            -scheme Polyplot \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Polyplot.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | tee build/xcodebuild.log

      # Fake-sign with the entitlements so signing tools that keep the IPA's entitlements carry them over.
      - name: Package IPA
        run: |
          APP=build/Polyplot.xcarchive/Products/Applications/Polyplot.app
          ldid -SPolyplotWidgets/PolyplotWidgets.entitlements "$APP/PlugIns/PolyplotWidgets.appex/PolyplotWidgets"
          ldid -SPolyplot/Polyplot.entitlements "$APP/Polyplot"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          mkdir -p build/dist
          (cd build/ipa && zip -qry "../dist/Polyplot-$APP_VERSION.ipa" Payload)

      # Just the IPA, not zipped (the artifact is named after the file).
      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          path: build/dist/Polyplot-${{ env.APP_VERSION }}.ipa
          archive: false

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Polyplot ${{ env.APP_VERSION }}
          body_path: .github/release-notes.md
          make_latest: true
          files: build/dist/Polyplot-${{ env.APP_VERSION }}.ipa
